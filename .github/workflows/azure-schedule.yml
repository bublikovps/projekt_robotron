name: Azure Cost Saver Schedule

on:
  schedule:
    # Включение в 07:00 UTC (08:00 CET зимой / 09:00 CEST летом) с Пн по Пт
    - cron: '0 7 * * 1-5'
    # Выключение в 16:00 UTC (17:00 CET зимой / 18:00 CEST летом) с Пн по Пт
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ручное управление (start или stop)'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop

permissions:
  id-token: write
  contents: read

jobs:
  manage-replicas:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine Min Replicas
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.action }}" == "start" ]; then
              echo "replicas=1" >> $GITHUB_OUTPUT
            else
              echo "replicas=0" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event.schedule }}" == "0 7 * * 1-5" ]; then
            echo "replicas=1" >> $GITHUB_OUTPUT
          else
            echo "replicas=0" >> $GITHUB_OUTPUT
          fi

      - name: Scale Container Apps
        run: |
          REPLICAS=${{ steps.mode.outputs.replicas }}
          echo "Setting min-replicas to $REPLICAS..."
          az containerapp update -n robotron-backend -g rg-robotron-demo --min-replicas $REPLICAS
          az containerapp update -n robotron-frontend -g rg-robotron-demo --min-replicas $REPLICAS
