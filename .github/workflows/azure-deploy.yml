name: Azure Infrastructure & Deploy

on:
  push:
    branches:
      - feature/azure
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply (ACR)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=azurerm_container_registry.acr \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
	        -var="mail_username=${{ secrets.MAIL_USERNAME }}" \
	        -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -var="image_tag=${{ github.sha }}"

      - name: Get ACR Login Server
        id: acr
        working-directory: terraform
        run: echo "login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: az acr login --name ${{ steps.acr.outputs.login_server }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/robotron-backend:${{ github.sha }} ./server
          docker push ${{ steps.acr.outputs.login_server }}/robotron-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/robotron-frontend:${{ github.sha }} ./my-angular-app
          docker push ${{ steps.acr.outputs.login_server }}/robotron-frontend:${{ github.sha }}

      - name: Terraform Apply (Full Stack)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
			-var="mail_username=${{ secrets.MAIL_USERNAME }}" \
	        -var="mail_password=${{ secrets.MAIL_PASSWORD }}" \
            -var="image_tag=${{ github.sha }}"

      - name: Show Application URL
        working-directory: terraform
        run: |
          echo "Frontend URL: $(terraform output -raw frontend_url)"
