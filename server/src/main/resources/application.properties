# ===================================================================
# Anwendungs-Konfiguration
# ===================================================================
spring.application.name=server

# ===================================================================
# Datenbank-Konfiguration (PostgreSQL)
# ===================================================================
# Verwendet Umgebungsvariablen fuer die Flexibilitaet (Docker/Schule/Production).
# Wenn keine Variablen gesetzt sind, werden die Fallback-Werte fuer Docker verwendet.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/robotron_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fuer die lokale Entwicklung zu Hause muss das SQL-Initialisierungsskript manuell ausgefuehrt werden.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

# Zeigt SQL-Abfragen in der Java-Konsole fuer das Debugging an (nur fuer Dev-Modus)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ===================================================================
# SMTP-Server-Konfiguration (Mailpit fuer lokale Entwicklung)
# ===================================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# ===================================================================
# Sicherheits-Konfiguration (JWT-Tokens)
# ===================================================================
# Token-Gueltigkeit (Standardwert: 24 Stunden in Millisekunden)
jwt.expiration=${JWT_EXPIRATION:86400000}

# JWT-Geheimschluessel abgesichert. Ein sicherer Platzhalter wird auf GitHub hochgeladen.
# Im realen Betrieb oder in der IDE wird der Schluessel aus der Umgebungsvariable JWT_SECRET geladen.
jwt.secret=${JWT_SECRET:DevelopmentLocalSecretKeyOnlyForTestingEnvironmentReplaceInProduction123!}

#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration