yaml
version: '3.8'

services:
  # Наша домашняя изолированная база данных
  postgres-db:
    image: postgres:15-alpine
    container_name: devzone-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: robotron_db  # Назовите как в школе или как хотите
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Наш домашний почтовый сервер вместо школьного батника
  mailpit:
    image: axllent/mailpit
    container_name: devzone-mailpit
    ports:
      - "1025:1025" # Сюда Спринг Бут будет слать письма
      - "8025:8025" # Сюда вы зайдете через браузер (localhost:8025) смотреть письма
      
volumes:
  pgdata: