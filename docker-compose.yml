version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: devzone-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: robotron_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: devzone-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
