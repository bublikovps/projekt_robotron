
<nav class="main-nav">

  <div class="container nav-container">

     

    <div
      class="logo"
      routerLink="/">

      IT-Portal

    </div>

     

    <button
      class="burger-menu"
      (click)="toggleMobileMenu()"
      [class.open]="isMobileMenuOpen">

      <span></span>
      <span></span>
      <span></span>

    </button>

     

    <div
      class="nav-links"
      [class.mobile-open]="isMobileMenuOpen">

       

      <div class="menu-center">

        <div class="dropdown">

          <a
            routerLink="/"
            class="nav-item dropdown-toggle"
            (click)="isMobileMenuOpen = false">

            Katalog

          </a>

          <div class="dropdown-menu">

            <a
              *ngFor="let cat of categories"
              [routerLink]="['/category', cat.id]"
              class="dropdown-item"
              (click)="isMobileMenuOpen = false">

              {{ cat.name }}

            </a>

          </div>

        </div>

        <a
          class="nav-item"
          (click)="isMobileMenuOpen = false">

          Über uns

        </a>

        <a
          class="nav-item"
          (click)="isMobileMenuOpen = false">

          News

        </a>

        <a
          class="nav-item"
          (click)="isMobileMenuOpen = false">

          Support

        </a>

      </div>

      <!-- Правая часть -->

      <div class="menu-right">

        <!-- ГОСТИ -->

        <ng-container *ngIf="!isLoggedIn()">

          <a
            routerLink="/login"
            class="nav-item login-btn"
            (click)="isMobileMenuOpen = false">

            Einloggen

          </a>

          <a
            routerLink="/register"
            class="nav-item reg-btn"
            (click)="isMobileMenuOpen = false">

            Registrieren

          </a>

        </ng-container>

         

          <ng-container *ngIf="isLoggedIn()">

            <div class="user-menu">

              <button
                class="user-menu-button"
                (click)="toggleUserMenu()">

                <div class="user-avatar">
                  👤
                </div>

                <div class="user-info">

                  <span class="user-login">
                    {{ getUsername() }}
                  </span>

                  <span class="user-role">
                    {{ getRoleDisplayName() }}
                  </span>

                </div>

                <span
                  class="user-arrow"
                  [class.user-arrow-open]="isUserMenuOpen">

                  ▼

                </span>

              </button>

              <div
                class="user-dropdown"
                *ngIf="isUserMenuOpen">

                <div class="user-dropdown-header">

                  <div class="user-dropdown-avatar">
                    👤
                  </div>

                  <div>

                    <strong>
                      {{ getUsername() }}
                    </strong>

                    <span>
                      {{ getRoleDisplayName() }}
                    </span>

                  </div>

                </div>

                <a
                  routerLink="/dashboard"
                  class="user-dropdown-item"
                  (click)="isUserMenuOpen = false">

                  🚀 Arbeitsbereich

                </a>

                <a
                  routerLink="/profile"
                  class="user-dropdown-item"
                  (click)="isUserMenuOpen = false">

                  👤 Mein Profil

                </a>

                <div class="dropdown-divider"></div>

                <a
                  class="user-dropdown-item logout-item"
                  (click)="onLogout()">

                  🚪 Abmelden

                </a>

              </div>

            </div>

          </ng-container>


      </div>

    </div>

  </div>

</nav>
