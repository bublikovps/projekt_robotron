<nav class="main-nav">
  <div class="container nav-container">
    <div class="logo" routerLink="/">IT-Portal</div>

    <button
      class="burger-menu"
      (click)="toggleMobileMenu()"
      [class.open]="isMobileMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links" [class.mobile-open]="isMobileMenuOpen">
      <div class="menu-center">
        <div
          class="dropdown"
          (mouseenter)="isCatalogMenuOpen = true"
          (mouseleave)="isCatalogMenuOpen = false">
          
          <a routerLink="/catalog" class="nav-item dropdown-toggle">Katalog</a>

          <div class="dropdown-menu" [class.dropdown-menu-open]="isCatalogMenuOpen">
            <a routerLink="/catalog" class="dropdown-item">Alle Produkte</a>
 
            <a
              *ngFor="let cat of categories()"
              routerLink="/catalog"
              [queryParams]="{
                category: cat.id
              }"
              class="dropdown-item">

              {{ cat.name }}

            </a>
          </div>
        </div>

        <a routerLink="/about" class="nav-item">Über uns</a>
        <a routerLink="/news" class="nav-item">News</a>
        <a routerLink="/support" class="nav-item">Support</a>
      </div>

      <div class="menu-right">
        <ng-container *ngIf="!isLoggedIn()">
          <a routerLink="/login" class="nav-item login-btn">Einloggen</a>
          <a routerLink="/register" class="nav-item reg-btn">Registrieren</a>
        </ng-container>

        <ng-container *ngIf="isLoggedIn()">
          <div class="user-menu">
            <button class="user-menu-button" (click)="toggleUserMenu()">
              <div class="user-avatar">{{ getUserInitials() }}</div>
              <div class="user-info">
                <span class="user-login">{{ getUsername() }}</span>
                <span class="user-role">{{ getRoleDisplayName() }}</span>
              </div>
              <span class="user-arrow" [class.user-arrow-open]="isUserMenuOpen">▼</span>
            </button>

            <div class="user-dropdown" *ngIf="isUserMenuOpen">
              <div class="user-dropdown-header">
                <div class="user-dropdown-avatar">{{ getUserInitials() }}</div>
                <div>
                  <strong>{{ getUsername() }}</strong>
                  <span>{{ getRoleDisplayName() }}</span>
                </div>
              </div>
              <a routerLink="/dashboard" class="user-dropdown-item">Arbeitsbereich</a>
              <a routerLink="/profile" class="user-dropdown-item">Mein Profil</a>
              <div class="dropdown-divider"></div>
              <a class="user-dropdown-item logout-item" (click)="onLogout()">Abmelden</a>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
