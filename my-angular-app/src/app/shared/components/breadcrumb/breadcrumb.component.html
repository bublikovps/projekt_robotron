<nav class="enterprise-breadcrumb">

  @for (
    item of items;
    track $index
  ) {

    @if (item.route) {

      <a
        [routerLink]="item.route"
        class="breadcrumb-link">

        {{ item.label }}

      </a>

    } @else {

      <span
        class="breadcrumb-current">

        {{ item.label }}

      </span>

    }

    @if (
      $index < items.length - 1
    ) {

      <span
        class="breadcrumb-separator">

        ›

      </span>

    }

  }

</nav>
