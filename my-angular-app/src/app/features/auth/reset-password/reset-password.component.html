<div class="auth-bento-container">
  <div class="auth-card bento-shadow">
    <div class="auth-header">
      <h2>Neues Passwort vergeben</h2>
      <p class="auth-subtitle">Geben Sie Ihr neues sicheres Passwort ein, um den Zugriff auf Ihr Konto wiederherzustellen.</p>
    </div>

    <!-- Уведомления об успехе или ошибке -->
    <div *ngIf="successMessage" class="alert success-msg">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert error-msg">{{ errorMessage }}</div>

    <!-- Форму показываем только если токен есть и сброс еще не выполнен -->
    <form *ngIf="token && !successMessage" (ngSubmit)="onResetPassword()">
      <div class="form-group-bento">
        <label for="newPassword">Neues Passwort</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          [(ngModel)]="newPassword" 
          required 
          class="form-input" 
          placeholder="••••••••"
          [disabled]="isLoading">
        <small class="form-hint">Mindestens 8 Zeichen, 1 Großbuchstabe, 1 Zahl, 1 Sonderzeichen.</small>
      </div>

      <button 
        type="submit" 
        class="auth-btn" 
        [disabled]="isLoading || !newPassword">
        <span *ngIf="!isLoading">Passwort speichern</span>
        <span *ngIf="isLoading">Wird gespeichert...</span>
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">← Zurück zum Login</a>
    </div>
  </div>
</div>
