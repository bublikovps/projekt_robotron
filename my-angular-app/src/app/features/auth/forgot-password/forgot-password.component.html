<div class="auth-bento-container">
  <div class="auth-card bento-shadow">
    <div class="auth-header">
      <h2>Passwort vergessen?</h2>
      <p class="auth-subtitle">Geben Sie Ihre E-Mail-Adresse ein, um einen sicheren Link zur Wiederherstellung zu erhalten.</p>
    </div>

    <!-- Уведомления об успехе или ошибке -->
    <div *ngIf="successMessage" class="alert success-msg">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert error-msg">{{ errorMessage }}</div>

    <form (ngSubmit)="onSendLink()" #forgotForm="ngForm">
      <div class="form-group-bento">
        <label for="email">E-Mail-Adresse</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          email
          #emailField="ngModel"
          class="form-input" 
          placeholder="name@firma.de"
          [disabled]="isLoading">
      </div>

      <!-- Кнопка блокируется, пока идет запрос на бэк, чтобы избежать повторной отправки (IHK-стандарт!) -->
      <button 
        type="submit" 
        class="auth-btn" 
        [disabled]="isLoading || !email">
        <span *ngIf="!isLoading">Link anfordern</span>
        <span *ngIf="isLoading" class="spinner">Wird gesendet...</span>
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="back-link">← Zurück zum Login</a>
    </div>
  </div>
</div>
